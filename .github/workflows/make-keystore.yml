# Put this at .github/workflows/make-keystore.yml. Run it ONCE to create your Play upload key.
# Before running, add repo secrets: KEYSTORE_PASSWORD, KEY_ALIAS (use: upload), KEY_PASSWORD (same value as KEYSTORE_PASSWORD).
name: make-keystore
on:
  workflow_dispatch:
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -v -keystore upload.jks -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Snake Escape, O=Snake Escape, C=IN"
          base64 -w0 upload.jks > keystore_base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-BACK-THIS-UP
          path: |
            upload.jks
            keystore_base64.txt

# Put this at .github/workflows/android-build.yml.
# Works with just the project .zip uploaded to the repo root: the build unpacks it itself (no terminal needed).
# Builds a debug APK always; builds a signed AAB too if the keystore secrets exist.
name: android-build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Unpack project zip (if uploaded as a zip)
        run: |
          if ls ./*.zip >/dev/null 2>&1; then
            unzip -oq ./*.zip
            cp -r snake-escape-app/. .
            rm -f .github/workflows/build.yml
          fi
      - name: Install Capacitor + plugins
        run: |
          npm install @capacitor/core @capacitor/app @capacitor/haptics @capacitor/status-bar @capacitor/splash-screen @capacitor-community/admob
          npm install -D @capacitor/cli
          npm install @capacitor/android
      - name: Create Android project
        run: |
          npx cap add android
          node scripts/configure-native.js
          npx cap sync android
      - name: Set versionCode from run number
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: snake-escape-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Build signed AAB (only if keystore secrets are set)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          cd android && ./gradlew bundleRelease
      - name: Upload AAB
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: snake-escape-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

# Cloud iOS build (no Mac needed). Setup steps are in DEPLOYMENT_PLAN.md section 5.
# Capacitor 8 creates an SPM-based iOS project (ios/App/App.xcodeproj, no workspace).
# If your ios/App folder has App.xcworkspace instead, use --workspace in build-ipa.
workflows:
  ios-testflight:
    name: iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CODEMAGIC_ASC_KEY        # name you give the API key in Codemagic settings
    environment:
      node: 20
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rdinfotechservice.snakeescape   # must match capacitor.config.json
      vars:
        APP_STORE_APPLE_ID: "0000000000"          # numeric Apple ID of the app in App Store Connect
    scripts:
      - name: Install JS deps
        script: npm ci
      - name: Apply ads config + sync
        script: |
          node scripts/configure-native.js
          npx cap sync ios
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
